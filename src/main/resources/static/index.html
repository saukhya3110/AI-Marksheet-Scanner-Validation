
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Marksheet Scanner</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172554;
        }

        header {
            background: #123b70;
            color: white;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 760px;
            margin: 35px auto;
            padding: 24px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px #00000012;
        }

        h2 { color: #123b70; }

        .upload {
            border: 2px dashed #7c9bc4;
            border-radius: 10px;
            padding: 28px;
            text-align: center;
            margin: 20px 0;
        }

        input { max-width: 100%; margin-top: 14px; }

        button {
            border: 0;
            background: #1763ad;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover { background: #0e477f; }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status { margin-top: 18px; line-height: 1.6; }

        #results {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Marksheet Scanner</h1>
        <p>Scan, extract and validate academic results</p>
    </header>

    <main>
        <h2>Upload Marksheet</h2>
        <p>Select a marksheet image or PDF for processing.</p>

        <form id="uploadForm">
            <div class="upload">
                <label for="file">Choose marksheet file</label><br>
                <input
                    id="file"
                    name="file"
                    type="file"
                    accept="image/*,.pdf"
                    required
                >
            </div>

            <button id="scanButton" type="submit">
                Scan and Validate
            </button>
        </form>

        <div id="status" role="status" aria-live="polite">
            Your scan results will appear here.
        </div>

        <section id="results"></section>
    </main>

    <footer>
        AI-Based Marksheet Scanning and Validation System
    </footer>

    <script>
        const form = document.getElementById("uploadForm");
        const fileInput = document.getElementById("file");
        const status = document.getElementById("status");
        const results = document.getElementById("results");
        const scanButton = document.getElementById("scanButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const file = fileInput.files[0];

            results.replaceChildren();

            if (!file) {
                status.textContent = "Please select a marksheet file.";
                return;
            }

            const allowedTypes = [
                "image/jpeg",
                "image/png",
                "image/webp",
                "application/pdf"
            ];

            const isImage = file.type.startsWith("image/");
            const isAllowed = allowedTypes.includes(file.type);

            if (!isAllowed || (!isImage && file.type !== "application/pdf")) {
                status.textContent =
                    "Please select a supported image or PDF file.";
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            status.textContent = "Uploading and scanning marksheet...";
            scanButton.disabled = true;

            try {
                const response = await fetch("/api/marksheets/scan", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    status.textContent =
                        result.error || result.message || "Scanning failed.";
                    return;
                }

                status.textContent = "Scan completed.";

                const heading = document.createElement("h3");
                heading.textContent = "Extracted Marksheet Text";

                const output = document.createElement("pre");
                output.textContent =
                    result.extractedText || "No text was extracted.";

                results.append(heading, output);

                if (result.validationResult) {
                    const validationHeading = document.createElement("h3");
                    validationHeading.textContent = "Validation Results";

                    const validation = document.createElement("pre");
                    validation.textContent =
                        typeof result.validationResult === "string"
                            ? result.validationResult
                            : JSON.stringify(result.validationResult, null, 2);

                    results.append(validationHeading, validation);
                }
            } catch (error) {
                status.textContent =
                    "Could not connect to the backend. The Java application must be running.";
            } finally {
                scanButton.disabled = false;
            }
        });
    </script>
</body>
</html>
